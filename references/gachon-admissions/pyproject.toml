[project]
name = "middle-test"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "kiwipiepy>=0.24.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-hwp-hwpx-loader[distribution]>=0.2.1",
    "langchain-openai>=1.7.3",
    "langchain-voyageai>=0.4.1",
    "pdfplumber>=0.11.10",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docparse"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]
